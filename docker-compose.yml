version: "3.9"

networks:
  suenweb-net:
    driver: bridge

services:
  suenweb:
    image: python:3.12-slim
    container_name: suenweb
    working_dir: /app
    ports:
      - "5080:5000"
    networks:
      - suenweb-net
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    environment:
      - TZ=Asia/Shanghai
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: >
      sh -c "pip install -q -r requirements.txt &&
             exec python -m uvicorn app:app --host 0.0.0.0 --port 5000 --workers 2 --log-level info"
    restart: unless-stopped

volumes:
  pip-cache:
