version: "3.9"

services:
  suenweb:
    image: python:3.12-slim
    container_name: suenweb
    working_dir: /app
    ports:
      - "5080:5000"
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    environment:
      - TZ=Asia/Shanghai
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    command: >
      sh -c "pip install -q -r requirements.txt gunicorn &&
             exec gunicorn -w 2 -b 0.0.0.0:5000 --timeout 120 app:app"
    restart: unless-stopped

volumes:
  pip-cache:
