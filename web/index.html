<!doctype html>
<html lang="zh-CN" data-theme="dark" data-tier="full" data-calm="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>SuenWeb 书签</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sw.theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.tier = localStorage.getItem('sw.tier') || 'full';
          document.documentElement.dataset.calm = localStorage.getItem('sw.calm') || 'false';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
