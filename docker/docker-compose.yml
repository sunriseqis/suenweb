services:
  suenweb:
    container_name: suenweb
    # 本地构建：docker compose up -d --build
    # 使用 GHCR 镜像：image: ghcr.io/sunriseqis/suenweb:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/sunriseqis/suenweb:latest
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      # BASE_URL: https://book.example.com   # 走 https 反代时填写，Cookie 才会带 Secure
    volumes:
      - ./data:/data
