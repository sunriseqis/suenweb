services:
  suenweb:
    container_name: suenweb
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: suenweb:2.0.0
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      # BASE_URL: https://book.example.com   # 走 https 反代时填写，Cookie 才会带 Secure
    volumes:
      - ./data:/data
