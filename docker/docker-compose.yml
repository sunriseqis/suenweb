services:
  suenweb:
    container_name: suenweb
    # 拉取 GHCR 镜像运行（推荐）
    image: ghcr.io/sunriseqis/suenweb:latest
    # 如需本地构建，注释掉上面的 image，启用下面的 build
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      NODE_ENV: production
      # BASE_URL: https://book.example.com   # 走 https 反代时填写，Cookie 才会带 Secure
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
