<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuenWeb · 导航页</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-scheme="purple" data-style="glass" data-pattern="grid" data-bg-type="gradient" style="--glass-intensity:1">

<!-- ═══════════ BACKGROUND LAYERS (4 modes, mutually exclusive) ═══════════ -->
<div class="bg-layer bg-pattern"></div>
<div class="bg-layer bg-gradient"></div>
<div class="bg-layer bg-wallpaper" id="wallpaperLayer"></div>

<!-- ═══════════ AUTH OVERLAY ═══════════ -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo"><img src="/static/favicon.png" alt="SuenWeb" style="width:64px;height:64px"></div>
    <h2 class="auth-title" id="authTitle">欢迎使用 SuenWeb</h2>
    <p class="auth-desc" id="authDesc">轻量个人导航页 · 搭配浏览器插件同步收藏夹 · SuenWeb</p>
    <div class="auth-form">
      <input type="password" id="authPassword" class="auth-input" placeholder="设置访问密码 (至少6位)" autofocus>
      <div class="auth-error" id="authError"></div>
      <button class="auth-btn" id="authBtn">设置密码并进入</button>
    </div>
  </div>
</div>

<!-- ═══════════ MAIN DASHBOARD ═══════════ -->
<main class="app" id="mainContainer" style="display:none" role="main">
  <section class="hero" id="heroSection" data-widget-style="bar" aria-label="主入口">
    <div class="hero-clock-weather">
      <div class="clock-block">
        <div class="clock" id="clock">00:00</div>
        <div class="date-text" id="dateDisplay"></div>
      </div>
      <div class="hero-divider" aria-hidden="true"></div>
      <div class="weather" id="weather"><span class="weather-icon"><img src="/static/icons/cloudy-line.svg" class="ico" alt=""></span><span class="weather-temp">--°</span><span class="weather-city">加载中</span></div>
    </div>
    <div class="hero-search">
      <span class="search-icon" aria-hidden="true"><img src="/static/icons/search-line.svg" class="ico" alt=""></span>
      <input type="search" class="search-input" id="searchInput" placeholder="搜索..." aria-label="搜索关键词">
      <div class="search-engine" id="searchEngine" role="tablist"></div>
    </div>
  </section>

  <section class="pinned-area" id="pinnedArea" aria-label="固定组"></section>

  <nav class="tab-bar" id="tabBar" role="tablist" aria-label="组标签"></nav>

  <section id="tabContentArea" aria-label="组内容"></section>

  <section class="onboarding" id="onboarding" style="display:none" aria-label="开始使用">
    <div class="onboarding-card">
      <div class="onboarding-icon"><img src="/static/icons/download-line.svg" class="ico ico-xl" alt=""></div>
      <h3>还没有收藏夹数据</h3>
      <p>安装浏览器插件自动同步，或上传书签文件</p>
      <div class="onboarding-options">
        <div class="onboard-opt">
          <div class="onboard-opt-icon"><img src="/static/icons/puzzle-line.svg" class="ico ico-lg" alt=""></div>
          <h4>浏览器插件 (推荐)</h4>
          <p>自动双向同步 Chrome / Edge / Firefox</p>
          <div class="plugin-list">
            <a href="/extension/download/crx" title="下载 .crx 安装包 (拖入 chrome://extensions 即可安装)">🟢 Chrome / Edge (.crx)</a>
            <a href="/extension/download/firefox">🦊 Firefox (.xpi)</a>
            <a href="/extension/download/zip" style="opacity:0.75" title="源码 ZIP 压缩包 (解压后加载)">📦 源码 ZIP</a>
          </div>
        </div>
        <div class="onboard-opt">
          <div class="onboard-opt-icon"><img src="/static/icons/upload-line.svg" class="ico ico-lg" alt=""></div>
          <h4>上传书签文件</h4>
          <p>从浏览器导出 HTML 书签上传</p>
          <label class="upload-btn" for="bookmarkFileInput">选择文件</label>
          <input type="file" id="bookmarkFileInput" accept=".html,.htm" style="display:none">
        </div>
        <div class="onboard-opt auth-only">
          <div class="onboard-opt-icon">✍️</div>
          <h4>手动创建</h4>
          <p>先建一个分组，再逐个添加常用链接</p>
          <button class="upload-btn" data-action="add-group-tab" type="button">+ 创建第一个分组</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ═══════════ FLOATING ACTIONS (bottom-right) ═══════════ -->
<div class="fab-actions" id="fabActions" aria-label="快捷操作">
  <button class="fab-btn guest-only" id="guestLoginBtn" title="登录" aria-label="登录"><img src="/static/icons/login-box-line.svg" class="ico" alt=""></button>
  <button class="fab-btn auth-only" id="settingsBtn" title="设置" aria-label="设置"><img src="/static/icons/settings-3-line.svg" class="ico" alt=""></button>
  <button class="fab-btn auth-only" id="editModeBtn" title="退出编辑模式" aria-label="切换编辑模式"><img src="/static/icons/edit-line.svg" class="ico" alt=""></button>
  <button class="fab-btn fab-btn-logout auth-only" id="logoutBtn" title="退出登录" aria-label="退出登录"><img src="/static/icons/logout-box-line.svg" class="ico" alt=""></button>
</div>

<!-- ═══════════ SETTINGS MODAL (centered, left-nav) ═══════════ -->
<div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="设置">
  <div class="settings-modal" role="document">
    <aside class="settings-sidebar" aria-label="设置分类">
      <div class="settings-modal-title">设置</div>
      <button class="settings-nav-item active" data-tab="presets"><span class="nav-icon"><img src="/static/icons/sun-line.svg" class="ico-sm" alt=""></span><span>预设</span></button>
      <button class="settings-nav-item" data-tab="scheme"><span class="nav-icon"><img src="/static/icons/palette-line.svg" class="ico-sm" alt=""></span><span>配色</span></button>
      <button class="settings-nav-item" data-tab="background"><span class="nav-icon"><img src="/static/icons/image-line.svg" class="ico-sm" alt=""></span><span>背景</span></button>
      <button class="settings-nav-item" data-tab="layout"><span class="nav-icon"><img src="/static/icons/check-line.svg" class="ico-sm" alt=""></span><span>布局</span></button>
      <button class="settings-nav-item" data-tab="widgets"><span class="nav-icon"><img src="/static/icons/puzzle-line.svg" class="ico-sm" alt=""></span><span>小组件</span></button>
      <button class="settings-nav-item" data-tab="bookmarks"><span class="nav-icon"><img src="/static/icons/bookmark-line.svg" class="ico-sm" alt=""></span><span>书签</span></button>
      <button class="settings-nav-item" data-tab="ai"><span class="nav-icon"><img src="/static/icons/robot-line.svg" class="ico-sm" alt=""></span><span>智能</span></button>
      <button class="settings-nav-item" data-tab="security"><span class="nav-icon"><img src="/static/icons/lock-password-line.svg" class="ico-sm" alt=""></span><span>安全</span></button>
    </aside>
    <main class="settings-content">
      <div class="settings-header">
        <h2 id="settingsTitle">预设</h2>
        <button class="panel-close" id="panelClose" title="关闭 (Esc)">✕</button>
      </div>
      <div class="settings-body" id="settingsBody"></div>
    </main>
  </div>
</div>

<!-- ═══════════ MODAL ═══════════ -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal-card" id="modalCard" style="display:none"></div>
</div>
<div class="toast-container" id="toastContainer"></div>

<!-- ═══════════ ONLINE ICON PICKER ═══════════ -->
<div class="icon-picker-overlay" id="onlineIconPickerOverlay" style="display:none">
  <div class="icon-picker-panel" id="onlineIconPickerPanel">
    <div class="icon-picker-header">
      <h4>在线图标</h4>
    </div>
    <div id="onlineIconPickerContent"></div>
    <div class="icon-picker-footer">
      <button id="onlineIconPickerReset">重置</button>
      <button onclick="closeOnlineIconPicker()">取消</button>
      <button class="btn-primary" id="onlineIconPickerConfirm">确定</button>
    </div>
  </div>
</div>

<!-- ═══════════ ICON PICKER ═══════════ -->
<div class="icon-picker-overlay" id="iconPickerOverlay">
  <div class="icon-picker-panel" id="iconPickerPanel">
    <div class="icon-picker-header">
      <h4>选择图标</h4>
      <button onclick="closeIconPicker()" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:18px">&times;</button>
    </div>
    <input class="icon-picker-search" id="iconPickerSearch" placeholder="搜索图标..." oninput="filterIconPicker()">
    <div class="icon-picker-grid" id="iconPickerGrid"></div>
    <div class="icon-picker-footer">
      <button onclick="closeIconPicker()">取消</button>
      <button class="btn-primary" id="iconPickerConfirm">确定</button>
    </div>
  </div>
</div>

<!-- ═══════════ ALL JS INLINE ═══════════ -->
<script>
// ====== STATE ======
const State = {
  token:        localStorage.getItem('suenweb_token') || '',
  groups:       [],
  settings:     {},
  syncStatus:   {},
};

// ====== UTILS ======
function toast(msg, type) {
  type = type || 'info';
  var c = document.getElementById('toastContainer');
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}
function escHtml(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function safeHref(u) { try { var x=new URL(u, location.origin); return /^(https?:|mailto:|ftp:)$/.test(x.protocol) ? x.href : '#'; } catch(e) { return '#'; } }
function showModal(html) {
  document.getElementById('modalCard').innerHTML = html;
  document.getElementById('modalCard').style.display = 'block';
  document.getElementById('modalOverlay').style.display = 'flex';
  // Focus first input
  setTimeout(function(){
    var first = document.getElementById('modalCard').querySelector('input, select, textarea, button');
    if (first && first !== document.activeElement) first.focus();
  }, 50);
}
function closeModal() {
  document.getElementById('modalCard').style.display = 'none';
  document.getElementById('modalOverlay').style.display = 'none';
}

// ====== ONLINE ICON PICKER ======
var _ONLINE_ICON_APIS = [
  { name: 'vemetric', template: 'https://favicon.vemetric.com/{domain}' },
  { name: 'im', template: 'https://a.favicon.im/{domain}?larger=true' },
  { name: '自定义', template: '' }
];

var _onlineIconPickerTarget = null;
var _onlineIconUrlInputId = null;
var _onlineIconPickerInitialDomain = '';

function showOnlineIconPicker(iconInputId, urlInputId) {
  _onlineIconPickerTarget = iconInputId;
  _onlineIconUrlInputId = urlInputId;
  
  var urlInput = document.getElementById(urlInputId);
  var targetUrl = (urlInput && urlInput.value.trim()) || '';
  
  var domain = '';
  try { domain = targetUrl ? new URL(targetUrl).hostname : ''; } catch(e) {}
  
  _onlineIconPickerInitialDomain = domain;

  var html = '<div style="min-width:360px;padding:16px">' +
    '<div style="display:flex;justify-content:center;margin-bottom:16px">' +
      '<div id="onlinePreview" style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--bg-hover);border-radius:var(--radius-md);border:2px dashed var(--glass-border);font-size:28px"></div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;text-align:center">选择图标代理 API，填入目标网站域名</div>' +
    '<div style="margin-bottom:12px">' +
      '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">目标网址（域名）</div>' +
      '<input id="onlineTargetUrl" value="' + escAttr(domain) + '" placeholder="github.com" style="width:100%;padding:8px 12px;background:var(--bg-hover);border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;box-sizing:border-box"> ' +
    '</div>' +
    '<div style="margin-bottom:16px">' +
      '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">图标 API</div>' +
      '<select id="onlineApiSelect" style="width:100%;padding:8px 12px;background:var(--bg-hover);border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;cursor:pointer">' +
        _ONLINE_ICON_APIS.map(function(api, idx) {
          return '<option value="' + idx + '">' + escHtml(api.name) + '</option>';
        }).join('') +
      '</select>' +
    '</div>' +
    '<div id="onlineCustomPanel" style="display:none;margin-bottom:16px;padding:12px;background:var(--bg-hover);border-radius:var(--radius-sm)">' +
      '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">自定义 API 前缀</div>' +
      '<input id="onlineCustomTpl" placeholder="https://favicon.im/" style="width:100%;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;box-sizing:border-box">' +
      '<div style="font-size:10px;color:var(--text-muted);margin-top:6px">格式：https://example.com/ （会自动拼接域名）</div>' +
    '</div>' +
    '<div id="onlineUrlPreview" style="display:none;margin-bottom:12px;padding:10px;background:rgba(167,139,250,0.1);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);word-break:break-all"></div>' +
  '</div>';

  document.getElementById('onlineIconPickerContent').innerHTML = html;
  document.getElementById('onlineIconPickerOverlay').style.display = 'flex';

  function generateAndPreview() {
    var domain = document.getElementById('onlineTargetUrl').value.trim();
    var apiIdx = parseInt(document.getElementById('onlineApiSelect').value);
    var preview = document.getElementById('onlinePreview');
    var urlPreview = document.getElementById('onlineUrlPreview');

    if (!domain) {
      preview.innerHTML = '';
      preview.style.border = '2px dashed var(--glass-border)';
      urlPreview.style.display = 'none';
      return;
    }

    var api = _ONLINE_ICON_APIS[apiIdx];
    var apiTpl = api.template;
    
    if (apiIdx === _ONLINE_ICON_APIS.length - 1) {
      var customPrefix = document.getElementById('onlineCustomTpl').value.trim();
      apiTpl = customPrefix ? customPrefix + '{domain}' : '';
    }

    if (!apiTpl) {
      preview.innerHTML = '';
      preview.style.border = '2px dashed var(--glass-border)';
      urlPreview.style.display = 'none';
      return;
    }

    var iconUrl = apiTpl.replace('{domain}', domain);
    preview.innerHTML = '<img src="' + escAttr(iconUrl) + '" style="width:40px;height:40px"><span style="display:none">🌐</span>';
    preview.style.border = 'none';
    urlPreview.innerHTML = '<strong>图标 URL：</strong>' + escHtml(iconUrl);
    urlPreview.style.display = 'block';
  }

  document.getElementById('onlineApiSelect').addEventListener('change', function() {
    var idx = parseInt(this.value);
    var customPanel = document.getElementById('onlineCustomPanel');
    customPanel.style.display = idx === _ONLINE_ICON_APIS.length - 1 ? 'block' : 'none';
    generateAndPreview();
  });

  document.getElementById('onlineTargetUrl').addEventListener('input', generateAndPreview);
  document.getElementById('onlineCustomTpl').addEventListener('input', generateAndPreview);

  document.getElementById('onlineIconPickerReset').onclick = function() {
    document.getElementById('onlineTargetUrl').value = _onlineIconPickerInitialDomain;
    document.getElementById('onlineApiSelect').value = '0';
    document.getElementById('onlineCustomPanel').style.display = 'none';
    document.getElementById('onlineCustomTpl').value = '';
    generateAndPreview();
  };

  document.getElementById('onlineIconPickerConfirm').onclick = function() {
    var domain = document.getElementById('onlineTargetUrl').value.trim();
    var apiIdx = parseInt(document.getElementById('onlineApiSelect').value);

    if (!domain) {
      toast('请输入目标网址', 'info');
      return;
    }

    var api = _ONLINE_ICON_APIS[apiIdx];
    var apiTpl = api.template;
    
    if (apiIdx === _ONLINE_ICON_APIS.length - 1) {
      var customPrefix = document.getElementById('onlineCustomTpl').value.trim();
      if (!customPrefix) {
        toast('请输入自定义 API 前缀', 'info');
        return;
      }
      apiTpl = customPrefix + '{domain}';
    }

    var iconUrl = apiTpl.replace('{domain}', domain);
    var iconInput = document.getElementById(_onlineIconPickerTarget);
    if (iconInput) {
      iconInput.value = iconUrl;
      iconInput.dispatchEvent(new Event('input'));
      var preview = document.getElementById(_onlineIconPickerTarget + '_preview');
      if (preview && iconUrl) {
        preview.innerHTML = '<img src="' + escAttr(iconUrl) + '" style="width:20px;height:20px">';
      }
    }
    closeOnlineIconPicker();
  };

  generateAndPreview();
}

function closeOnlineIconPicker() {
  document.getElementById('onlineIconPickerOverlay').style.display = 'none';
  _onlineIconPickerTarget = null;
  _onlineIconUrlInputId = null;
}

document.getElementById('onlineIconPickerOverlay').addEventListener('click', function(e){
  if (e.target === this) closeOnlineIconPicker();
});

// ====== ICON PICKER ======
var _iconPickerTarget = null;
var _suppressSettingSave = false;
var _dragState = null;

function showIconPicker(inputId) {
  var currentValue = document.getElementById(inputId).value;
  _iconPickerTarget = inputId;
  var grid = document.getElementById('iconPickerGrid');
  var search = document.getElementById('iconPickerSearch');
  search.value = '';

  // Build grid from built-in icons list
  if (!window._builtinIcons) {
    grid.innerHTML = '<div class="icon-picker-empty">加载中...</div>';
    fetch('/api/builtin-icons').then(function(r){return r.json();}).then(function(data){
      window._builtinIcons = data.icons || [];
      _renderIconGrid(window._builtinIcons, currentValue);
    }).catch(function(){
      grid.innerHTML = '<div class="icon-picker-empty">加载失败</div>';
    });
  } else {
    _renderIconGrid(window._builtinIcons, currentValue);
  }

  document.getElementById('iconPickerOverlay').classList.add('open');
  document.getElementById('iconPickerConfirm').onclick = function(){
    var sel = grid.querySelector('.icon-picker-item.selected');
    if (sel) {
      var val = sel.dataset.iconPath;
      var inp = document.getElementById(_iconPickerTarget);
      if (inp) { inp.value = val; inp.dispatchEvent(new Event('input')); }
      // Show preview
      var preview = document.getElementById(_iconPickerTarget+'_preview');
      if (preview && val) {
        preview.innerHTML = '<img src="'+escAttr(val)+'" style="width:20px;height:20px;filter:brightness(0) saturate(100%) invert(1)">';
      }
    }
    closeIconPicker();
  };
}

function _renderIconGrid(icons, currentValue) {
  var grid = document.getElementById('iconPickerGrid');
  if (!icons.length) { grid.innerHTML = '<div class="icon-picker-empty">无图标</div>'; return; }
  grid.innerHTML = icons.map(function(ic){
    var sel = ic.path === currentValue ? ' selected' : '';
    return '<div class="icon-picker-item'+sel+'" data-icon-path="'+escAttr(ic.path)+'" data-icon-name="'+escAttr(ic.name)+'" onclick="selectIconItem(this)"><img src="'+escAttr(ic.path)+'" alt="'+escAttr(ic.name)+'" loading="lazy"></div>';
  }).join('');
}

function selectIconItem(el) {
  el.parentElement.querySelectorAll('.icon-picker-item').forEach(function(x){ x.classList.remove('selected'); });
  el.classList.add('selected');
}

function filterIconPicker() {
  var q = document.getElementById('iconPickerSearch').value.toLowerCase();
  var items = document.querySelectorAll('#iconPickerGrid .icon-picker-item');
  items.forEach(function(it){
    var name = (it.dataset.iconName || '').toLowerCase();
    it.style.display = (!q || name.indexOf(q) >= 0) ? '' : 'none';
  });
}

function closeIconPicker() {
  document.getElementById('iconPickerOverlay').classList.remove('open');
  _iconPickerTarget = null;
}
// Close icon picker on overlay click
document.getElementById('iconPickerOverlay').addEventListener('click', function(e){
  if (e.target === this) closeIconPicker();
});
// Esc closes icon picker too
// Esc closes modals, settings, icon picker
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape' && e.keyCode !== 27) return;
  var iconPicker = document.getElementById('iconPickerOverlay');
  if (iconPicker && iconPicker.classList.contains('open')) { closeIconPicker(); return; }
  if (document.getElementById('modalCard').style.display === 'block') { closeModal(); return; }
  if (document.getElementById('settingsOverlay').classList.contains('open')) { closeSettings(); return; }
});
function renderLinkIcon(link) {
  var icon = link.icon || '';
  var iconType = link.icon_type || 'auto';
  if (iconType === 'emoji' && icon) { return '<span class="link-icon">'+escHtml(icon)+'</span>'; }
  if ((iconType === 'url' || iconType === 'auto') && icon && icon.indexOf('/static/icons/')===0) {
    return '<img class="link-icon-img" src="'+escAttr(icon)+'" alt="" onerror="this.style.display=\'none\'" style="filter:brightness(0) saturate(100%) invert(1)">';
  }
  if ((iconType === 'url' || iconType === 'auto') && icon && icon.indexOf('http')===0) {
    return '<img class="link-icon-img" src="/api/icon/proxy?url='+encodeURIComponent(icon)+'" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline\'"><span class="link-icon" style="display:none"></span>';
  }
  if (icon) return '<span class="link-icon">'+escHtml(icon)+'</span>';
  try { var d = new URL(link.url).hostname; return '<img class="link-icon-img" src="/api/icon/proxy?domain='+encodeURIComponent(d)+'" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline\'"><span class="link-icon" style="display:none"></span>'; }
  catch(e) { return '<span class="link-icon"></span>'; }
}
var DEFAULT_GROUP_ICON = '/static/icons/bookmark-line.svg';
var DEFAULT_GROUP_ICON_TAG = '<img src="/static/icons/bookmark-line.svg" class="group-icon-svg" alt="">';
function clearIconPreview(inputId) {
  var input = document.getElementById(inputId);
  if (input) input.value = '';
  var prev = document.getElementById(inputId + '_preview');
  if (prev) prev.innerHTML = DEFAULT_GROUP_ICON_TAG;
}
function renderGroupIcon(icon) {
  if (!icon || icon === '📁') return DEFAULT_GROUP_ICON_TAG;
  if (icon.indexOf('/static/icons/')===0) {
    return '<img src="'+escAttr(icon)+'" class="group-icon-svg" alt="" onerror="this.onerror=null;this.src=\''+DEFAULT_GROUP_ICON+'\'">';
  }
  return escHtml(icon);
}

// ====== API ======
function apiHeaders() {
  var h = { 'Content-Type': 'application/json' };
  if (State.token) h['Authorization'] = 'Bearer ' + State.token;
  return h;
}
async function api(method, path, body) {
  var opts = { method: method, headers: apiHeaders() };
  if (body) opts.body = JSON.stringify(body);
  var resp = await fetch(path, opts);
  var data = await resp.json().catch(function(){ return {}; });
  if (!resp.ok) throw new Error(data.detail || data.error || 'HTTP ' + resp.status);
  return data;
}
async function uploadFile(path, file) {
  var form = new FormData(); form.append('file', file);
  var resp = await fetch(path, { method:'POST', headers:{Authorization:'Bearer '+State.token}, body:form });
  var data = await resp.json().catch(function(){ return {}; });
  if (!resp.ok) throw new Error(data.detail || data.error || 'HTTP '+resp.status);
  return data;
}

// ====== DASHBOARD ======
async function refresh() { await loadData(); renderAll(); }
async function loadData() {
  try {
    var resp = await fetch('/api/data');
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    State.groups = ((await resp.json()).groups) || [];
    State.syncStatus = State.token ? await fetch('/api/sync/status',{headers:{Authorization:'Bearer '+State.token}}).then(function(r){return r.json();}).catch(function(){return {};}) : {};
  } catch(e) {
    State.groups = [];
  }
}
function renderAll() {
  var hasData = State.groups.length > 0;
  document.getElementById('onboarding').style.display    = hasData ? 'none' : 'flex';
  document.getElementById('pinnedArea').style.display    = hasData ? '' : 'none';
  document.getElementById('tabBar').style.display        = hasData ? '' : 'none';
  document.getElementById('tabContentArea').style.display = hasData ? '' : 'none';
  if (!hasData) return;
  var pinned = State.groups.filter(function(g){ return g.type==='pinned'; });
  var tabs   = State.groups.filter(function(g){ return g.type==='tab' && !pinned.some(function(p){ return p.id===g.id || p.name===g.name; }); });
  renderPinned(pinned); renderTabs(tabs);
}

function renderPinned(groups) {
  var area = document.getElementById('pinnedArea');
  var singleGroups = groups.filter(function(g){ return (g.layout_mode || 'single') === 'single'; });
  var multiGroups = groups.filter(function(g){ return g.layout_mode === 'multi'; });
  var html = '';
  if (singleGroups.length) {
    html += '<div class="pinned-single-list">' + singleGroups.map(renderPinnedCard).join('') + '</div>';
  }
  if (multiGroups.length) {
    var rows = packMultiRows(multiGroups.length);
    var idx = 0;
    for (var r = 0; r < rows.length; r++) {
      var cols = rows[r];
      var slice = multiGroups.slice(idx, idx + cols);
      idx += cols;
      html += '<div class="pinned-multi-grid cols-' + cols + '">' + slice.map(renderPinnedCard).join('') + '</div>';
    }
  }
  html += '<button class="add-link-btn" data-action="add-group-pinned" style="min-height:80px">+ 添加固定组</button>';
  area.innerHTML = html;
}
function packMultiRows(n) {
  if (n <= 0) return [];
  var rows = [];
  while (n > 0) {
    if (n === 1) { rows.push(1); break; }
    if (n === 2) { rows.push(2); break; }
    if (n === 4) { rows.push(2, 2); break; }
    if (n >= 3) { rows.push(3); n -= 3; continue; }
    rows.push(n); break;
  }
  return rows;
}

async function handleDashboardClick(e) {
  var btn = e.target.closest('[data-action]'); if (!btn) return;
  var action = btn.dataset.action;
  var id = btn.dataset.id ? parseInt(btn.dataset.id) : null;
  switch(action) {
    case 'add-link': addLink(id); break;
    case 'add-group-pinned': addGroup('pinned'); break;
    case 'add-group-tab': addGroup('tab'); break;
    case 'edit-group': editGroup(id); break;
    case 'edit-link': editLink(id); break;
    case 'toggle-group': toggleGroupType(id); break;
    case 'delete-group': deleteGroup(id); break;
  }
}

function initDragAndDrop(){
  document.addEventListener('dragstart', function(e){
    if (_isGuest || !_editMode) return;
    var link = e.target.closest('.drag-link');
    var group = e.target.closest('.drag-group');
    if (link) {
      _dragState = {type:'link', id:parseInt(link.dataset.linkId)};
      e.dataTransfer.effectAllowed = 'move';
      link.classList.add('dragging');
    } else if (group) {
      _dragState = {type:'group', id:parseInt(group.dataset.groupId)};
      e.dataTransfer.effectAllowed = 'move';
      group.classList.add('dragging');
    }
  });
  document.addEventListener('dragend', function(){
    document.querySelectorAll('.dragging,.drag-over').forEach(function(x){ x.classList.remove('dragging','drag-over'); });
    _dragState = null;
  });
  document.addEventListener('dragover', function(e){
    if (!_dragState || _isGuest) return;
    var target = _dragState.type === 'link' ? e.target.closest('.link-drop-zone,.drag-link') : e.target.closest('.drag-group');
    if (!target) return;
    e.preventDefault();
    target.classList.add('drag-over');
  });
  document.addEventListener('dragleave', function(e){
    var t = e.target.closest && e.target.closest('.drag-over');
    if (t) t.classList.remove('drag-over');
  });
  document.addEventListener('drop', async function(e){
    if (!_dragState || _isGuest) return;
    var target = _dragState.type === 'link' ? e.target.closest('.link-drop-zone,.drag-link') : e.target.closest('.drag-group');
    if (!target) return;
    e.preventDefault();
    try {
      if (_dragState.type === 'group') await dropGroup(parseInt(target.dataset.groupId));
      else await dropLink(target);
    } catch(err) { toast(err.message || '拖动失败','error'); await refresh(); }
  });
}

async function dropGroup(targetId){
  var from = State.groups.findIndex(function(g){return g.id===_dragState.id});
  var to = State.groups.findIndex(function(g){return g.id===targetId});
  if (from < 0 || to < 0 || from === to) return;
  var item = State.groups.splice(from,1)[0];
  State.groups.splice(to,0,item);
  renderAll();
  await api('POST','/api/reorder/groups',{ids:State.groups.map(function(g){return g.id;})});
}

async function dropLink(target){
  var sourceId = _dragState.id;
  var targetLink = target.closest('.drag-link');
  var zone = target.closest('.link-drop-zone') || target;
  var groupId = parseInt(zone.dataset.groupId || (targetLink && targetLink.closest('.link-drop-zone').dataset.groupId));
  var fromGroup = State.groups.find(function(g){return g.links.some(function(l){return l.id===sourceId;});});
  var toGroup = State.groups.find(function(g){return g.id===groupId;});
  if (!fromGroup || !toGroup) return;
  var srcIdx = fromGroup.links.findIndex(function(l){return l.id===sourceId;});
  var item = fromGroup.links.splice(srcIdx,1)[0];
  item.group_id = groupId;
  var insertIdx = targetLink ? toGroup.links.findIndex(function(l){return l.id===parseInt(targetLink.dataset.linkId);}) : toGroup.links.length;
  if (insertIdx < 0) insertIdx = toGroup.links.length;
  toGroup.links.splice(insertIdx,0,item);
  renderAll();
  await api('POST','/api/reorder/links',{group_id:groupId,ids:toGroup.links.map(function(l){return l.id;})});
  if (fromGroup.id !== toGroup.id && fromGroup.links.length) await api('POST','/api/reorder/links',{group_id:fromGroup.id,ids:fromGroup.links.map(function(l){return l.id;})});
}

// ====== AUTH ======
async function checkAuthStatus(){ try{ var r=await fetch('/api/auth/status'); return (await r.json()).has_password; }catch(e){ return false; } }
async function doSetup(pw){ var r=await api('POST','/api/auth/setup',{password:pw}); State.token=r.token||pw; localStorage.setItem('suenweb_token',State.token); }
async function doLogin(pw){ var r=await api('POST','/api/auth/login',{password:pw}); State.token=r.token||pw; localStorage.setItem('suenweb_token',State.token); }
async function doLogout(){ try{await api('POST','/api/auth/logout');}catch(e){} State.token=''; localStorage.removeItem('suenweb_token'); }

async function showAuth() {
  document.getElementById('authOverlay').style.display = 'flex';
  document.getElementById('mainContainer').style.display = 'none';
  var hasPassword = await checkAuthStatus();
  var title = document.getElementById('authTitle');
  var desc  = document.getElementById('authDesc');
  var btn   = document.getElementById('authBtn');
  var input = document.getElementById('authPassword');
  var error = document.getElementById('authError');
  if (hasPassword) {
    title.textContent = '欢迎回来';
    desc.textContent  = '输入密码以访问你的 SuenWeb 导航页';
    btn.textContent   = '登录';
    input.placeholder = '输入访问密码';
  } else {
    title.textContent = '欢迎使用 SuenWeb';
    desc.textContent  = '轻量个人导航页 · 搭配浏览器插件同步收藏夹 · SuenWeb';
    btn.textContent   = '设置密码并进入';
    input.placeholder = '设置访问密码 (至少6位)';
  }
  error.textContent = '';
  btn.onclick = async function() {
    var pw = input.value.trim();
    if (pw.length < 6) { error.textContent = '密码至少6位'; return; }
    btn.disabled = true; btn.textContent = '...';
    try {
      if (hasPassword) await doLogin(pw); else await doSetup(pw);
      setEditMode(true);
      error.textContent = '';
      hideAuth();
      await initDashboard();
    } catch(e) { error.textContent = e.message; }
    btn.disabled = false;
    btn.textContent = hasPassword ? '登录' : '设置密码并进入';
  };
  input.onkeydown = function(e){ if(e.key==='Enter') btn.click(); };
  input.focus();
}
function hideAuth() {
  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('mainContainer').style.display = '';
  setGuestMode(false);
}
async function initDashboard() {
  try { await loadData(); }
  catch(e) { if(e.message.indexOf('401')>=0||e.message.indexOf('AUTH_REQUIRED')>=0) return; console.error(e); return; }
  hideAuth(); setGuestMode(false); renderAll();
}

  document.getElementById('egSave').onclick = async function(){
    var name=document.getElementById('egName').value.trim();

    var mode=document.getElementById('egMode').value;
    var layoutEl=document.getElementById('egLayout');
    var layoutMode=layoutEl?layoutEl.value:'single';
    if(!name){ toast('名称不能为空','error'); return; }
    try{ await api('PUT','/api/groups/'+gid,{name:name,icon:icon||'',display_mode:mode,layout_mode:layoutMode}); closeModal(); await refresh(); toast('已更新','success'); }
    catch(e){ toast(e.message,'error'); }

async function toggleGroupType(gid){
  var group = State.groups.find(function(g){ return g.id===gid; }); if(!group) return;
  var newType = group.type === 'pinned' ? 'tab' : 'pinned';
  var oldType = group.type;
  // Optimistic: immediate UI update, no waiting for server
  group.type = newType;
  renderAll();
  try{ await api('PUT','/api/groups/'+gid,{type:newType}); await refresh(); toast(newType==='pinned'?'已固定':'已移到标签栏','info'); }
  catch(e){ group.type = oldType; renderAll(); toast(e.message,'error'); }
}
async function deleteGroup(gid){
  var group = State.groups.find(function(g){ return g.id===gid; }); if(!group) return;
  if(!confirm('确定删除「'+group.name+'」及其所有链接？')) return;
  // Optimistic: remove immediately from state and re-render
  var idx = State.groups.indexOf(group);
  State.groups.splice(idx, 1);
  renderAll();
  try{ await api('DELETE','/api/groups/'+gid); await refresh(); toast('已删除','info'); }
  catch(e){ await refresh(); toast(e.message,'error'); }

function applyPreset(preset) {
  // 视觉风格
  document.body.setAttribute('data-style', preset.style);
  saveSetting('style', preset.style);
  // 背景模式

  // 同步状态到内存

  // 重置自定义 hex 输入

  var sc = _COLOR_SCHEMES.filter(function(s){return s.id===preset.scheme})[0];
  if (sc && hexIn) hexIn.value = sc.hex;

  document.querySelectorAll('.bgmode-card').forEach(function(c){ c.classList.toggle('active', c.dataset.mode===preset.bgType); });
}

function _matchPreset() {
  var curScheme = _widgetCfg.color_scheme || document.body.getAttribute('data-scheme') || 'purple';
  var curStyle  = document.body.getAttribute('data-style') || 'glass';
  var curBg     = document.body.getAttribute('data-bg-type') || 'gradient';
  if (_widgetCfg.accent_color) return null; // 自定义色不属于任何预设
  for (var i = 0; i < _PRESETS.length; i++) {
    var p = _PRESETS[i];
    if (p.scheme === curScheme && p.style === curStyle && p.bgType === curBg) return p.id;
  }
  return null;
}

function hexToRgb(hex) {
  var h = hex.replace('#','');
  if (h.length === 3) h = h.split('').map(function(c){return c+c}).join('');
  return {
    r: parseInt(h.slice(0,2),16),
    g: parseInt(h.slice(2,4),16),
    b: parseInt(h.slice(4,6),16)
  };
}

function hexToHue(hex) {
  var rgb = hexToRgb(hex);
  var r = rgb.r/255, g = rgb.g/255, b = rgb.b/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var d = max - min;
  if (d === 0) return 0;
  var h;
  if (max === r) h = ((g-b)/d + 6) % 6;
  else if (max === g) h = (b-r)/d + 2;
  else h = (r-g)/d + 4;
  h = Math.round(h * 60);
  return h % 360;
}

function applyColorScheme(schemeId, customHex) {
  document.body.setAttribute('data-scheme', schemeId);
  _widgetCfg.color_scheme = schemeId;
  if (customHex && /^#[0-9a-f]{6}$/i.test(customHex)) {
    var rgb = hexToRgb(customHex);
    var r = rgb.r+','+rgb.g+','+rgb.b;
    var hue = hexToHue(customHex);
    document.documentElement.style.setProperty('--accent', customHex);
    document.documentElement.style.setProperty('--accent-rgb', r);
    document.documentElement.style.setProperty('--accent-glow', 'rgba('+r+',0.35)');
    document.documentElement.style.setProperty('--accent-soft', 'rgba('+r+',0.12)');
    document.documentElement.style.setProperty('--accent-h', hue);
    _widgetCfg.accent_color = customHex;
  } else {
    document.documentElement.style.removeProperty('--accent');
    document.documentElement.style.removeProperty('--accent-rgb');
    document.documentElement.style.removeProperty('--accent-glow');
    document.documentElement.style.removeProperty('--accent-soft');
    document.documentElement.style.removeProperty('--accent-h');
    _widgetCfg.accent_color = '';
  }
  if (!_suppressSettingSave) {
    saveSetting('color_scheme', schemeId);
    saveSetting('accent_color', _widgetCfg.accent_color || '');
  }
}

function applyAccentColor(hex) {
  if (!/^#[0-9a-f]{3,8}$/i.test(hex)) return;
  var scheme = _findClosestScheme(hex);
  applyColorScheme(scheme.id, hex);
  // Update hue variables so surfaces coordinate with custom accent
  var hue = hexToHue(hex);
  document.documentElement.style.setProperty('--accent-h', hue);
}

function _findClosestScheme(hex) {
  var hue = hexToHue(hex);
  var best = _COLOR_SCHEMES[0];
  var bestDiff = 360;
  _COLOR_SCHEMES.forEach(function(s){
    var sh = hexToHue(s.hex);
    var d = Math.abs(hue - sh);
    if (d > 180) d = 360 - d;
    if (d < bestDiff) { bestDiff = d; best = s; }
  });
  return best;
}

      '<div class="settings-card">'+
        '<p class="card-desc">导出或导入所有配置（设置、分组、链接、壁纸源）</p>'+
        '<div style="display:flex;gap:12px;flex-wrap:wrap">'+

          '<div style="color:var(--text-muted);margin-bottom:8px">待导入内容：</div>'+

          '</div>'+
        '</div>'+

  }

  return '<div class="settings-section active"><p>未知标签</p></div>';
}

function _bindSettingsEvents() {
  var body = document.getElementById('settingsBody');

  // Nav items
  document.querySelectorAll('.settings-nav-item').forEach(function(t){
    if (!t.dataset.tab) return;
    t.onclick = function(){ switchSettingsTab(t.dataset.tab); };
  });

  if (_currentSettingsTab === 'presets') {
    body.querySelectorAll('.preset-card').forEach(function(c){
      c.onclick = function(){
        var pid = c.dataset.preset;
        var preset = _PRESETS.filter(function(p){return p.id===pid;})[0];
        if (preset) {
          applyPreset(preset);
          toast('已应用「'+preset.name+'」','success');
        }
      };
    });
  }

  if (_currentSettingsTab === 'scheme') {
    // 配色方案卡片
    body.querySelectorAll('.scheme-card').forEach(function(c){
      c.onclick = function(){
        var schemeId = c.dataset.schemeVal;

        body.querySelectorAll('.scheme-card').forEach(function(x){x.classList.remove('active')});

    if (hexIn) hexIn.oninput = function(){ if (/^#[0-9a-f]{6}$/i.test(hexIn.value) && colorIn) colorIn.value = hexIn.value; };
    if (applyBtn) applyBtn.onclick = function(){
      var v = (hexIn && hexIn.value) || (colorIn && colorIn.value) || '';

  if (_currentSettingsTab === 'widgets') {
    var cfgWidgetStyle = document.getElementById('cfgWidgetStyle');
    if (cfgWidgetStyle) cfgWidgetStyle.onchange = function(){ _widgetCfg.widget_style = cfgWidgetStyle.value; applyWidgetChrome(); saveWidgetCfg(); };

    if (cfgClock) cfgClock.onchange = function(){ _widgetCfg.clock = cfgClock.value; updateClock(); saveWidgetCfg(); };

    if (cfgCity) cfgCity.onchange = function(){ _widgetCfg.weather_city = cfgCity.value.trim() || 'Beijing'; fetchWeather(); saveWidgetCfg(); };

    var cfgDef = document.getElementById('cfgSearchDefault');
    function updateDefaultDropdown() {
      if (!cfgDef) return;
      var cbs = cfgEngs.querySelectorAll('input:checked');
      var opts = []; cbs.forEach(function(cb){ opts.push(cb.value); });
      var prev = cfgDef.value;
      cfgDef.innerHTML = opts.map(function(k){ return '<option value="'+k+'"'+(k===prev?' selected':'')+'>'+(_ENGINE_MAP[k]?_ENGINE_MAP[k].name:k)+'</option>'; }).join('');
      if (opts.indexOf(cfgDef.value)<0 && opts.length>0) cfgDef.value = opts[0];
      _searchEngine = cfgDef.value;
    }
    if (cfgEngs) cfgEngs.addEventListener('change', function(){
      var cbs = cfgEngs.querySelectorAll('input:checked');
      var engs = []; cbs.forEach(function(cb){engs.push(cb.value)});
      if (engs.length===0) { engs=['google']; cfgEngs.querySelector('input[value=google]').checked=true; }
      _widgetCfg.search_engines = engs.join(',');
      if (engs.indexOf(_searchEngine)<0) _searchEngine = engs[0];
      renderSearchEngines(); initSearch(); saveWidgetCfg();
      updateDefaultDropdown();
    });
    if (cfgDef) { updateDefaultDropdown(); cfgDef.onchange = function(){ _searchEngine = cfgDef.value; renderSearchEngines(); initSearch(); saveWidgetCfg(); }; }
  }

  if (_currentSettingsTab === 'bookmarks') {

        var r = await api('POST','/api/auth/change-password',{old_password:o,new_password:n});

        document.getElementById('newPassword').value='';

    };

    // 导出配置
    var exportBtn = document.getElementById('exportConfigBtn');
    if (exportBtn) exportBtn.onclick = async function(){
      try {
        var resp = await fetch('/api/config/export', {headers: {Authorization: 'Bearer ' + State.token}});
        var data = await resp.json();
        var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'suenweb_config_' + new Date().toISOString().slice(0,10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
        toast('配置已导出','success');
      } catch(e) { toast(e.message || '导出失败','error'); }
    };

    // 导入配置
    var importBtn = document.getElementById('importConfigBtn');
    var importFile = document.getElementById('importConfigFile');
    var importPreview = document.getElementById('importPreview');
    var importPreviewContent = document.getElementById('importPreviewContent');
    var confirmImportBtn = document.getElementById('confirmImportBtn');
    var cancelImportBtn = document.getElementById('cancelImportBtn');
    var pendingImportData = null;

    if (importBtn && importFile) {
      importBtn.onclick = function(){ importFile.click(); };
      importFile.onchange = function(e){
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          try {
            var data = JSON.parse(ev.target.result);
            if (data.version !== 1) {
              toast('不支持的配置版本','error');
              return;
            }
            pendingImportData = data;
            // 显示预览
            var previewHtml = '<div style="color:var(--text-primary);font-weight:500;margin-bottom:6px">导出时间：' + (data.exported_at || '未知') + '</div>';
            previewHtml += '<div style="display:flex;gap:16px;flex-wrap:wrap;color:var(--text-secondary)">';
            if (data.settings) previewHtml += '<span>设置：' + Object.keys(data.settings).length + ' 项</span>';
            if (data.groups) previewHtml += '<span>分组：' + data.groups.length + ' 个</span>';
            if (data.groups && data.groups.length > 0) {
              var linkCount = data.groups.reduce(function(sum, g){ return sum + (g.links ? g.links.length : 0); }, 0);
              previewHtml += '<span>链接：' + linkCount + ' 个</span>';
            }
            if (data.wallpapers) previewHtml += '<span>壁纸源：' + data.wallpapers.length + ' 个</span>';
            if (data.fonts) previewHtml += '<span>字体：' + data.fonts.length + ' 个</span>';
            previewHtml += '</div>';
            previewHtml += '<div style="color:var(--warning);margin-top:8px;font-size:12px">⚠️ 导入将覆盖现有的分组和链接数据</div>';
            importPreviewContent.innerHTML = previewHtml;
            importPreview.style.display = 'block';
          } catch(e) {
            toast('配置文件格式错误','error');
          }
        };
        reader.readAsText(file);
        importFile.value = '';
      };
    }

    if (confirmImportBtn) {
      confirmImportBtn.onclick = async function(){
        if (!pendingImportData) return;
        try {
          var resp = await fetch('/api/config/import', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + State.token},
            body: JSON.stringify(pendingImportData)
          });
          var result = await resp.json();
          if (result.ok) {
            toast('配置已导入：' + (result.imported.groups || 0) + ' 个分组，' + (result.imported.links || 0) + ' 个链接','success');
            importPreview.style.display = 'none';
            pendingImportData = null;
            await refresh();
            loadSettings();
          } else {
            toast(result.detail || '导入失败','error');
          }
        } catch(e) {
          toast(e.message || '导入失败','error');
        }
      };
    }

    if (cancelImportBtn) {
      cancelImportBtn.onclick = function(){
        importPreview.style.display = 'none';
        pendingImportData = null;
      };
    }
  }
}
function onGroupChange(prefix){
  var cbs=document.querySelectorAll('.'+prefix+'-grp');
  var btnId=prefix==='ai-complete'?'aiSmartCompleteBtn':'aiCheckBtn';
  var btn=document.querySelector('#'+btnId);
  var checked=Array.from(cbs).filter(function(c){return c.checked});
  if(btn){ btn.disabled=checked.length===0; btn.textContent=checked.length===0?'请先勾选目标分组':(prefix==='ai-complete'?'补全 '+checked.length+' 组':'检测 '+checked.length+' 组'); }
}
function toggleAllGroups(prefix){
  document.querySelectorAll('.'+prefix+'-grp').forEach(function(cb){cb.checked=true});
  onGroupChange(prefix);
}
function toggleRevGroups(prefix){
  document.querySelectorAll('.'+prefix+'-grp').forEach(function(cb){cb.checked=!cb.checked});
  onGroupChange(prefix);
}
async function saveWidgetCfg(){
  if(!State.token || _suppressSettingSave) return;
  try{ await api('PUT','/api/settings',{clock_format:_widgetCfg.clock,weather_city:_widgetCfg.weather_city,widget_style:_widgetCfg.widget_style,search_engines:_widgetCfg.search_engines,search_default:_searchEngine,llm_url:_widgetCfg.llm_url,llm_key:_widgetCfg.llm_key,llm_model:_widgetCfg.llm_model,font_body:_widgetCfg.font_body,font_title:'',font_body_en:'',font_code:'',font_size:_widgetCfg.font_size}); }catch(e){}
}
async function saveSetting(key,value){ if(_suppressSettingSave) return; try{ await api('PUT','/api/settings',{[key]:String(value)}); }catch(e){} }

// ====== WALLPAPER SYSTEM ======
function formatInterval(sec){ if(sec>=9999||sec===0) return '从不'; if(sec<60) return sec+'秒'; var m=Math.floor(sec/60); if(m<60) return m+'分钟'; var h=Math.floor(m/60); return h+'小时'+((m%60)?(m%60)+'分钟':''); }
function clearWallpaperTimer(){ if(_wpTimer){ clearInterval(_wpTimer); _wpTimer=null; } }
function resetWallpaperTimer(){ clearWallpaperTimer(); var iv=State.wpInterval||900; if(iv>=9999||iv===0) return; _wpTimer=setInterval(function(){ refreshWallpaper('next'); }, iv*1000); }

async function refreshWallpaper(direction){
  try{
    var resp=await fetch('/api/wallpaper/refresh',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+State.token},body:JSON.stringify({direction:direction})});
    var data=await resp.json();
    if(data.url) applyWallpaper(data.url);
    loadWallpaperSources(); // refresh the source list to show current index
  } catch(e){ console.error('Wallpaper refresh error:', e); }
}

async function loadWallpaper(){
  try{
    var resp=await fetch('/api/wallpaper');
    var data=await resp.json();
    if(data.background_type) document.body.setAttribute('data-bg-type', data.background_type);
    if(data.url && document.body.getAttribute('data-bg-type')==='wallpaper') applyWallpaper(data.url);
  } catch(e){}
}

function applyWallpaper(url){
  var layer=document.getElementById('wallpaperLayer');
  if(!layer) return;
  var img=new Image();
  img.onload=function(){ layer.style.backgroundImage='url('+url+')'; layer.style.display='block'; layer.style.opacity='1'; };
  img.onerror=function(){ layer.style.opacity='0'; };

async function loadWallpaperSources(){
  var bingRow=document.getElementById('wpBingRow');
  var gameList=document.getElementById('wpGameList');
  if(!bingRow && !gameList) return;
  try{
    var resp=await fetch('/api/wallpaper/sources');
    var data=await resp.json();
    State.wpInterval=data.interval||900;
    State.wpSources=data.sources||[];
    var currentIndex=data.current_index||0;

    // Split sources: Bing vs SteamGridDB games vs other
    var bingSrc=null, sgdbSrcs=[], otherSrcs=[];
    data.sources.forEach(function(src){
      if(src.source_type==='url' && src.category==='builtin' && src.name.indexOf('必应')>=0){
        bingSrc=src;
      } else if(src.source_type==='steamgriddb'){
        sgdbSrcs.push(src);
      } else {
        otherSrcs.push(src);
      }
    });

    // Bing row — compact inline
    if(bingRow){
      bingRow.innerHTML='<label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1">'+
        '<input type="checkbox" '+(bingSrc.enabled?'checked':'')+' onchange="toggleWallpaperSource('+bingSrc.id+',this.checked)">'+
        '<span style="color:var(--text-primary)">必应每日</span>'+
        '<span style="color:var(--text-muted);margin-left:auto;font-size:var(--text-xs)">cn.bing.com</span>'+
      '</label>'+
      (currentIndex===data.sources.indexOf(bingSrc)?'<span style="font-size:var(--text-xs);color:var(--success);font-weight:500;flex-shrink:0;margin-left:8px">当前</span>':'');
    }

    // SteamGridDB game list — collapsible
    var enabledCount=sgdbSrcs.filter(function(s){return s.enabled;}).length;
    var countEl=document.getElementById('wpGameCount');
    if(countEl) countEl.textContent=enabledCount+' 个已启用';

    if(gameList){
      if(sgdbSrcs.length===0){
        gameList.innerHTML='<div style="color:var(--text-muted);font-size:12px;padding:10px;text-align:center">暂无 SteamGridDB 源，请先配置 API Key</div>';
      } else {
        var html='';
        sgdbSrcs.forEach(function(src, i){
          var isCurrent=data.sources.indexOf(src)===currentIndex;
          html+='<div class="wp-item">'+
            '<input type="checkbox" value="'+src.id+'" '+(src.enabled?'checked':'')+' onchange="toggleWallpaperSource('+src.id+',this.checked)">'+
            '<span class="wp-name">'+escHtml(src.name)+'</span>'+
            (isCurrent?'<span class="wp-current">当前</span>':'')+
            (src.category!=='builtin'?'<button class="wp-del" onclick="deleteWallpaperSource('+src.id+')">✕</button>':'')+
          '</div>';
        });
        // Add other non-bing, non-SGDB sources at bottom
        otherSrcs.forEach(function(src, i){
          var isCurrent=data.sources.indexOf(src)===currentIndex;
          html+='<div class="wp-item">'+
            '<input type="checkbox" value="'+src.id+'" '+(src.enabled?'checked':'')+' onchange="toggleWallpaperSource('+src.id+',this.checked)">'+
            '<span class="wp-name">'+escHtml(src.name)+'</span>'+
            (isCurrent?'<span class="wp-current">当前</span>':'')+
            '<button class="wp-del" onclick="deleteWallpaperSource('+src.id+')">✕</button>'+
          '</div>';
        });
        gameList.innerHTML=html;
      }
    }

    // Update interval select if it exists
    var intervalSelect=document.getElementById('wpIntervalSelect'); if(intervalSelect){ intervalSelect.value=State.wpInterval >= 9999 ? '9999' : String(State.wpInterval); }

    // SGDB status
    var st=document.getElementById('sgdbStatus');
    if(st){ st.textContent=data.steamgriddb_configured?'OK ('+data.steamgriddb_api_key+')':'未配置'; st.style.color=data.steamgriddb_configured?'var(--success)':'var(--text-muted)'; }
  } catch(e){
    if(bingRow) bingRow.innerHTML='<span style="font-size:12px;color:var(--error)">加载失败</span>';
    if(gameList) gameList.innerHTML='<div style="color:var(--error);font-size:12px;padding:8px">加载失败</div>';
  }
}

function applyFontSettings(){
  var body=_widgetCfg.font_body||'';
  var size=_widgetCfg.font_size||14;
  var stack=[];
  if(body) stack.push('"'+body+'"');
  stack.push('-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif');
  var fontStr=stack.join(',');
  document.documentElement.style.setProperty('--font-body-family', fontStr);
  document.documentElement.style.setProperty('--font-title-family', fontStr);
  document.documentElement.style.setProperty('--font-code-family', fontStr);
  document.body.style.fontFamily=fontStr;
  document.body.style.fontSize=size+'px';
  document.documentElement.style.setProperty('--text-base',size+'px');
  // Override inherit-based font-family with !important so inputs/buttons/links pick it up too
  var bs=document.getElementById('font-body-style'); if(bs) bs.remove();
  bs=document.createElement('style'); bs.id='font-body-style';
  bs.textContent='html,body,input,select,textarea,button,a,code,pre,.search-input,.settings-input,.settings-select,.engine-btn,.btn-tiny,.fab-btn,.group-action-btn,.add-link-btn,.upload-btn,.tab-content,.pinned-card,.links-grid,.grid-link,.pin-link,.icon-only-link,.link-info,.link-title,.link-desc,.tab-bar{font-family:var(--font-body-family) !important}';
  document.head.appendChild(bs);
  var ts=document.getElementById('font-title-style'); if(ts) ts.remove();
  var cs=document.getElementById('font-code-style'); if(cs) cs.remove();
  // Use server-side proxy: <link rel=stylesheet> + woff2 proxied through /api/font-woff
  // This avoids MIME blocks, CORS, fetch race conditions, and relative URL resolution issues.
  var selected=[body];
  _fontList.forEach(function(f){
    if(selected.indexOf(f.family)<0) return;
    var linkId = 'font-link-' + f.id;
    if (document.getElementById(linkId)) return;
    var link = document.createElement('link');
    link.id = linkId;
    link.rel = 'stylesheet';
    link.href = '/api/font-css/' + f.id + '.css';
    link.onload = function() { console.log('Font loaded via proxy:', f.name, f.family); };
    link.onerror = function() { console.warn('Font proxy fail:', f.name, f.family); };
    document.head.appendChild(link);
  });
}

    if(s.style) document.body.setAttribute('data-style', s.style);
    // Only re-apply when server actually returned a value, otherwise we'd
    // overwrite the user's current scheme/accent with the in-memory default.
    if (s.color_scheme || s.accent_color) {

  document.querySelectorAll('.auth-only').forEach(function(el){ el.style.display = guest ? 'none' : ''; });
  document.querySelectorAll('.guest-only').forEach(function(el){ el.style.display = guest ? '' : 'none'; });
  // No edit buttons in guest mode
  document.body.classList.toggle('guest-mode', guest);
  if (guest) { document.body.classList.remove('browse-mode'); } else { setEditMode(_editMode); }
}
function showGuestDashboard() {
  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('mainContainer').style.display = '';
  setGuestMode(true);
  loadData().then(function(){ renderAll(); }).catch(function(){});
}

// ====== INIT ======
async function init(){
  try{
    // Settings
    var s={};
    try{ var resp=await fetch('/api/settings', State.token ? {headers:{Authorization:'Bearer '+State.token}} : {}); s=await resp.json(); }catch(e){}
    if(s.pattern) document.body.setAttribute('data-pattern',s.pattern);
    loadWidgetCfg(s);
    // Widgets
    renderSearchEngines(); initSearch();
    updateClock(); setInterval(updateClock,1000); fetchWeather();
    // Wallpaper & Fonts
    applyBackgroundType(document.body.getAttribute('data-bg-type')||'gradient');
    // Load font list before applying, so CDN fonts are available
    try { var fr = await fetch('/api/fonts'); var fd = await fr.json(); _fontList = fd.fonts || []; } catch(e) { _fontList = []; }
    applyFontSettings();
    // Auth gate
    if(State.token){
      try{ await loadData(); document.getElementById('authOverlay').style.display='none'; document.getElementById('mainContainer').style.display=''; setGuestMode(false); renderAll(); }
      catch(e){ showGuestDashboard(); }
    } else {
      var hasPw = await checkAuthStatus();
      if(hasPw) { showGuestDashboard(); }
      else { showAuth(); }
    }
    // Events
    document.getElementById('guestLoginBtn').addEventListener('click', showAuth);
    document.getElementById('settingsBtn').addEventListener('click',openSettings);
    document.getElementById('editModeBtn').addEventListener('click',function(){ setEditMode(!_editMode); toast(_editMode?'已进入编辑模式':'已退出编辑模式','info'); });
    document.getElementById('panelClose').addEventListener('click',closeSettings);
    document.getElementById('settingsOverlay').addEventListener('click',function(e){ if(e.target===e.currentTarget) closeSettings(); });
    document.getElementById('logoutBtn').addEventListener('click',async function(){ await doLogout(); State.groups=[]; State.token=''; localStorage.removeItem('suenweb_token'); window.location.reload(); });
    document.addEventListener('click',async function(e){
      if(_isGuest) return;
      var btn=e.target.closest('[data-action]'); if(!btn) return;
      if(btn.tagName==='BUTTON'||btn.dataset.action) e.preventDefault();
      handleDashboardClick(e);
    });
    document.getElementById('bookmarkFileInput').addEventListener('change',function(e){ var f=e.target.files[0]; if(f) uploadBookmarks(f); e.target.value=''; });
    document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===e.currentTarget) closeModal(); });
    initDragAndDrop();
  }catch(e){ var el=document.getElementById('authError'); if(el) el.textContent='Error: '+e.message; console.error(e); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script>
