name: 构建发行飞牛端

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（如 v2.0.0，不填则读 server/package.json 版本）'
        required: false
        default: ''

jobs:
  build-and-release-fnos:
    name: Build & Release fnOS FPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Assets
        run: |
          cd web && npm ci --no-audit --no-fund && npm run build && cd ..

      - name: Build fnOS FPK Package
        run: node scripts/build-fn.mjs

      - name: Prepare Release Tag
        id: prep
        run: |
          set -e
          RAW_VER=$(grep -m1 '"version"' server/package.json | sed 's/[^0-9.]//g')
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v${RAW_VER}"
            fi
          fi
          echo "tag=suenweb-${TAG}" >> $GITHUB_OUTPUT
          echo "version=${RAW_VER}" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        run: |
          node scripts/prepare-release-notes.mjs \
            --platform fnos \
            --tag "${{ steps.prep.outputs.tag }}" \
            --output /tmp/release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.SUENAPP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Checksums
        run: |
          cd output && sha256sum *.fpk > checksums.txt && cd ..

      - name: Release to Public Repo (sunriseqis/suenapp)
        env:
          GH_TOKEN: ${{ secrets.SUENAPP_TOKEN }}
        run: |
          gh release create "${{ steps.prep.outputs.tag }}" \
            --repo sunriseqis/suenapp \
            --title "SuenWeb v${{ steps.prep.outputs.version }}" \
            --notes-file /tmp/release_body.md \
            output/*.fpk output/checksums.txt || \
          {
            gh release edit "${{ steps.prep.outputs.tag }}" \
              --repo sunriseqis/suenapp \
              --title "SuenWeb v${{ steps.prep.outputs.version }}" \
              --notes-file /tmp/release_body.md
            gh release upload "${{ steps.prep.outputs.tag }}" \
              --repo sunriseqis/suenapp \
              --clobber \
              output/*.fpk output/checksums.txt
          }
