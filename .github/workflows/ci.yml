name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: server typecheck & test
        working-directory: server
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm test
      - name: web typecheck, build & dom-check
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run build
          npm run check:dom
      - name: addon syntax & pack
        run: |
          node --check addons/src/background.js
          node --check addons/src/options.js
          node --check addons/src/popup.js
          npm --prefix addons run pack
      - name: no native deps gate
        run: |
          ! grep -iE '"(better-sqlite3|sqlite3|argon2|sharp|bcrypt|canvas|node-gyp)"' server/package.json web/package.json
