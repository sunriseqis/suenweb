<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <title>SuenWeb 设置</title>
    <style>
      body { width: auto; max-width: 460px; margin: 32px auto; padding: 0 16px; }
      main { padding: 16px 0; gap: 12px; }
      h1 { font-size: 18px; font-weight: 300; margin: 0 0 12px; }
      .field { display: grid; gap: 4px; margin-bottom: 10px; }
      .field span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; }
      .toggle { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; }
      .toggle input { width: auto; }
      .server-line {
        margin: 0 0 12px;
        padding: 8px 10px;
        border-left: 2px solid var(--accent);
        background: rgba(27, 161, 226, 0.08);
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark"></span>
      <strong>SuenWeb</strong>
    </header>
    <main>
      <div id="loginForm">
        <label class="field">
          <span>服务端地址</span>
          <input id="baseUrl" placeholder="http://192.168.89.10:8080" />
        </label>
        <label class="field">
          <span>管理员密码</span>
          <input id="password" type="password" placeholder="至少 6 位" />
        </label>
        <div class="row">
          <button id="login" class="primary">登录</button>
          <button id="test" class="secondary">测试</button>
        </div>
      </div>

      <div id="accountBox" hidden>
        <p id="serverLine" class="server-line"></p>
        <div class="row">
          <button id="logout" class="secondary">登出</button>
        </div>
        <div class="row">
          <button id="extBackup" class="secondary">插件备份</button>
          <button id="extRestore" class="secondary">插件还原</button>
        </div>
        <label class="toggle">
          <input id="newtab" type="checkbox" />
          <span>打开新标签页时显示 SuenWeb</span>
        </label>
      </div>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
