<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <title>收藏到 SuenWeb</title>
  </head>
  <body>
    <header>
      <span class="mark"></span>
      <strong>SuenWeb</strong>
      <button id="openOptions" class="ghost" title="设置">设置</button>
    </header>
    <main>
      <p id="pageTitle" class="title">读取当前页面…</p>
      <p id="serverLine" class="url"></p>

      <div id="loginBox" hidden>
        <button id="goLogin" class="primary wide">去登录</button>
      </div>

      <div id="errorBox" hidden>
        <button id="retryBtn" class="secondary wide">重试</button>
      </div>

      <div id="groups" class="group-grid" hidden></div>

      <p id="beat" class="status" role="status"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
